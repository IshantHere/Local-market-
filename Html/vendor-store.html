<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Profile - Vendor Portal</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="page-wrapper">
    <div class="container" style="max-width: 680px;">
      <div style="margin-bottom: 24px; padding-bottom: 14px; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center;">
        <div>
          <span class="badge badge-warning" style="margin-bottom: 4px;">Vendor Profile</span>
          <h1 style="font-size: 1.45rem; font-weight: 700; color: var(--text-main);">Store Settings & Bio</h1>
          <p style="font-size: 0.85rem; color: var(--text-muted);">Manage your storefront presence on the neighbourhood marketplace.</p>
        </div>
        <a href="vendor-dashboard.html" class="btn btn-sm btn-outline">&larr; Back to Dashboard</a>
      </div>

      <div class="card">
        <form id="vendor-store-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="store-name">Store / Farm / Workshop Name *</label>
            <input type="text" id="store-name" name="name" class="form-control" required minlength="2">
          </div>

          <div class="form-row">
            <div class="form-group form-col">
              <label class="form-label" for="store-category">Primary Category Focus *</label>
              <select id="store-category" name="category" class="form-control" required>
                <option value="Fresh Produce">Fresh Produce</option>
                <option value="Bakery">Bakery</option>
                <option value="Dairy & Eggs">Dairy & Eggs</option>
                <option value="Pantry & Groceries">Pantry & Groceries</option>
                <option value="Handmade Crafts">Handmade Crafts</option>
              </select>
            </div>
            <div class="form-group form-col">
              <label class="form-label" for="store-locality">Neighborhood Locality *</label>
              <select id="store-locality" name="locality" class="form-control" required>
                <option value="Northwood Hills">Northwood Hills</option>
                <option value="Historic Downtown">Historic Downtown</option>
                <option value="Riverdale Valley">Riverdale Valley</option>
                <option value="Old Town Market">Old Town Market</option>
                <option value="East Arts District">East Arts District</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group form-col">
              <label class="form-label" for="store-email">Contact Email *</label>
              <input type="email" id="store-email" name="contactEmail" class="form-control" required>
            </div>
            <div class="form-group form-col">
              <label class="form-label" for="store-phone">Contact Phone Number</label>
              <input type="tel" id="store-phone" name="phone" class="form-control">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="store-bio">Store Bio & Philosophy *</label>
            <textarea id="store-bio" name="bio" class="form-control" rows="4" required minlength="10" placeholder="Describe your farm harvesting schedule, baking technique, or craftsmanship methods..."></textarea>
          </div>

          <div class="form-group" style="background: var(--bg-subtle); padding: 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-light);">
            <label class="form-label" style="margin-bottom: 6px;">Store Operating Status</label>
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
              <input type="checkbox" id="store-is-open" name="isOpen" style="width: 18px; height: 18px; cursor: pointer;">
              <span style="font-size: 0.9rem; font-weight: 600;">Store is currently OPEN for orders</span>
            </label>
            <small style="display: block; color: var(--text-muted); font-size: 0.78rem; margin-top: 4px;">
              Uncheck to temporarily pause new customer orders (e.g. seasonal recess or holiday break).
            </small>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
            <button type="submit" class="btn btn-primary">Save Profile Updates</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../js/storage.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/orders.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/vendor-store.js"></script>
</body>
</html>
