<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - Local Market</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Global Shared Header -->
  <div id="site-header"></div>

  <main class="page-wrapper">
    <div class="container" id="product-detail-container">
      <!-- Breadcrumbs -->
      <nav style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">
        <a href="index.html">Home</a> &rsaquo;
        <a href="products.html">Products</a> &rsaquo;
        <span id="breadcrumb-category">Category</span> &rsaquo;
        <span id="breadcrumb-product-name" style="color: var(--text-main); font-weight: 600;">Product</span>
      </nav>

      <!-- Main Product View (Two column) -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 36px; margin-bottom: 48px; background: #fff; padding: 24px; border: 1px solid var(--border-light); border-radius: var(--radius-md);">
        <!-- Col 1: Product Image -->
        <div>
          <div style="border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-light); background: var(--bg-subtle); aspect-ratio: 4/3;">
            <img id="detail-img" src="" alt="Product Image" style="width: 100%; height: 100%; object-fit: cover;">
          </div>
          <div style="margin-top: 14px; display: flex; align-items: center; justify-content: space-between;">
            <button class="btn btn-sm btn-outline" id="detail-compare-btn">
              &#8644; Add to Compare
            </button>
            <span class="badge badge-secondary" id="detail-category-badge">Category</span>
          </div>
        </div>

        <!-- Col 2: Details & Add to Cart -->
        <div style="display: flex; flex-direction: column;">
          <!-- Vendor Link -->
          <div style="margin-bottom: 6px;">
            <a href="#" id="detail-vendor-link" style="font-size: 0.9rem; font-weight: 600; color: var(--accent-primary);">
              📍 Vendor Name
            </a>
            <span style="font-size: 0.82rem; color: var(--text-muted);" id="detail-vendor-locality"> &bull; Locality</span>
          </div>

          <h1 id="detail-title" style="font-size: 1.6rem; font-weight: 700; color: var(--text-main); margin-bottom: 10px; line-height: 1.25;">
            Product Title
          </h1>

          <div id="detail-rating-wrapper" style="margin-bottom: 16px;">
            <!-- Stars -->
          </div>

          <div style="margin-bottom: 20px; padding: 14px 0; border-top: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light);">
            <div style="display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px;">
              <span id="detail-price" style="font-size: 1.8rem; font-weight: 800; color: var(--text-main);">₹0.00</span>
              <span id="detail-stock-badge" class="badge badge-success">In Stock</span>
            </div>
            <div id="detail-stock-count" style="font-size: 0.82rem; color: var(--text-muted);">
              Available inventory: 0 units
            </div>
          </div>

          <div style="margin-bottom: 24px;">
            <h3 style="font-size: 0.92rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px;">
              Description
            </h3>
            <p id="detail-description" style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6;">
              Product description goes here.
            </p>
          </div>

          <!-- Purchase Controls -->
          <div style="margin-top: auto; padding: 18px; background: var(--bg-subtle); border-radius: var(--radius-md); border: 1px solid var(--border-light);">
            <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
              <div>
                <label for="detail-qty" style="display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px;">
                  QUANTITY
                </label>
                <div class="qty-control" style="background: #fff;">
                  <button type="button" class="qty-btn" id="qty-minus-btn">&minus;</button>
                  <input type="number" id="detail-qty" class="qty-input" value="1" min="1" max="99">
                  <button type="button" class="qty-btn" id="qty-plus-btn">&plus;</button>
                </div>
              </div>

              <div style="flex: 1; min-width: 180px;">
                <label style="display: block; font-size: 0.78rem; font-weight: 600; color: transparent; margin-bottom: 4px;">ACTION</label>
                <button type="button" class="btn btn-primary btn-block" id="detail-add-cart-btn">
                  🛒 Add to Cart
                </button>
              </div>
            </div>
            <div id="qty-error" style="color: var(--danger); font-size: 0.78rem; margin-top: 6px; display: none;"></div>
          </div>
        </div>
      </div>

      <!-- Reviews Section -->
      <section style="background: #fff; padding: 24px; border: 1px solid var(--border-light); border-radius: var(--radius-md); margin-bottom: 30px;">
        <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-bottom: 20px; border-bottom: 1px solid var(--border-light); padding-bottom: 14px;">
          <div>
            <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--text-main);">Customer Reviews & Ratings</h2>
            <div id="reviews-summary-text" style="font-size: 0.85rem; color: var(--text-muted);">
              Based on verified customer orders
            </div>
          </div>
          <button class="btn btn-sm btn-outline" id="toggle-review-form-btn">
            ✍ Write a Review
          </button>
        </div>

        <!-- Write Review Form (Collapsible) -->
        <div id="review-form-container" style="display: none; background: var(--bg-subtle); padding: 18px; border-radius: var(--radius-md); margin-bottom: 24px; border: 1px solid var(--border-light);">
          <h3 style="font-size: 1rem; font-weight: 600; margin-bottom: 12px;">Share Your Honest Feedback</h3>
          <form id="product-review-form">
            <div class="form-row">
              <div class="form-group form-col">
                <label class="form-label" for="review-author-name">Your Name *</label>
                <input type="text" id="review-author-name" class="form-control" placeholder="e.g. Sarah J." required>
              </div>
              <div class="form-group form-col">
                <label class="form-label" for="review-rating-select">Rating (Stars) *</label>
                <select id="review-rating-select" class="form-control" required>
                  <option value="5">★★★★★ - 5 (Excellent)</option>
                  <option value="4">★★★★☆ - 4 (Very Good)</option>
                  <option value="3">★★★☆☆ - 3 (Average)</option>
                  <option value="2">★★☆☆☆ - 2 (Disappointed)</option>
                  <option value="1">★☆☆☆☆ - 1 (Poor)</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="review-comment">Review Details *</label>
              <textarea id="review-comment" class="form-control" rows="3" placeholder="Tell other neighborhood shoppers about freshness, taste, craftsmanship, or packaging..." required minlength="5"></textarea>
            </div>

            <div style="display: flex; gap: 10px; justify-content: flex-end;">
              <button type="button" class="btn btn-sm btn-outline" id="cancel-review-btn">Cancel</button>
              <button type="submit" class="btn btn-sm btn-primary">Submit Review</button>
            </div>
          </form>
        </div>

        <!-- Reviews List -->
        <div id="product-reviews-list" style="display: flex; flex-direction: column; gap: 16px;">
          <!-- Populated by product.js -->
        </div>
      </section>
    </div>
  </main>

  <!-- Global Shared Footer -->
  <div id="site-footer"></div>

  <!-- Core Scripts -->
  <script src="../js/storage.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/orders.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/product.js"></script>
</body>
</html>
