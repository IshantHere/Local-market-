<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account - Local Market</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Global Shared Header -->
  <div id="site-header"></div>

  <main class="page-wrapper">
    <div class="container" style="max-width: 580px;">
      <div class="card" style="padding: 28px;">
        <div style="text-align: center; margin-bottom: 24px;">
          <span style="font-size: 2rem;">🌱</span>
          <h1 style="font-size: 1.4rem; font-weight: 700; margin-top: 6px;">Join the Local Market</h1>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">
            Shop from local growers or sell your own handcrafted goods.
          </p>
        </div>

        <form id="register-form" novalidate>
          <!-- Role Selector -->
          <div style="margin-bottom: 20px;">
            <label class="form-label">I want to register as: *</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
              <label style="border: 2px solid var(--accent-primary); background: var(--accent-light); padding: 10px; border-radius: var(--radius-sm); text-align: center; cursor: pointer;" id="role-label-customer">
                <input type="radio" name="role" value="customer" checked style="display: none;">
                <strong>🛒 Customer</strong>
                <small style="display: block; font-size: 0.72rem; color: var(--text-muted);">Buy neighborhood goods</small>
              </label>

              <label style="border: 2px solid var(--border-light); background: transparent; padding: 10px; border-radius: var(--radius-sm); text-align: center; cursor: pointer;" id="role-label-vendor">
                <input type="radio" name="role" value="vendor" style="display: none;">
                <strong>🚜 Local Vendor</strong>
                <small style="display: block; font-size: 0.72rem; color: var(--text-muted);">Sell farm/artisan items</small>
              </label>
            </div>
          </div>

          <!-- Basic Personal Info -->
          <div class="form-group">
            <label class="form-label" for="reg-name">Your Full Name *</label>
            <input type="text" id="reg-name" name="name" class="form-control" placeholder="e.g. Maya Chen" required minlength="2">
          </div>

          <div class="form-row">
            <div class="form-group form-col">
              <label class="form-label" for="reg-email">Email Address *</label>
              <input type="email" id="reg-email" name="email" class="form-control" placeholder="maya@example.com" required>
            </div>
            <div class="form-group form-col">
              <label class="form-label" for="reg-phone">Phone Number</label>
              <input type="tel" id="reg-phone" name="phone" class="form-control" placeholder="+1 (555) 000-0000">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group form-col">
              <label class="form-label" for="reg-password">Password *</label>
              <input type="password" id="reg-password" name="password" class="form-control" placeholder="At least 6 characters" required minlength="6">
            </div>
            <div class="form-group form-col">
              <label class="form-label" for="reg-locality">Neighborhood Area *</label>
              <select id="reg-locality" name="locality" class="form-control" required>
                <option value="Northwood Hills">Northwood Hills</option>
                <option value="Historic Downtown">Historic Downtown</option>
                <option value="Riverdale Valley">Riverdale Valley</option>
                <option value="Old Town Market">Old Town Market</option>
                <option value="East Arts District">East Arts District</option>
              </select>
            </div>
          </div>

          <!-- Vendor-Only Fields (Dynamically revealed when Vendor is checked) -->
          <div id="vendor-extra-fields" style="display: none; background: var(--bg-subtle); padding: 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-light); margin-bottom: 20px;">
            <h3 style="font-size: 0.95rem; font-weight: 700; color: var(--accent-primary); margin-bottom: 12px;">
              🏪 Your Store Profile
            </h3>

            <div class="form-group">
              <label class="form-label" for="reg-store-name">Store / Brand Name *</label>
              <input type="text" id="reg-store-name" name="storeName" class="form-control" placeholder="e.g. Sharma Fresh Farm">
            </div>

            <div class="form-group">
              <label class="form-label" for="reg-store-category">Primary Category Focus *</label>
              <select id="reg-store-category" name="storeCategory" class="form-control">
                <option value="Fresh Produce">Fresh Produce</option>
                <option value="Bakery">Bakery</option>
                <option value="Dairy & Eggs">Dairy & Eggs</option>
                <option value="Pantry & Groceries">Pantry & Groceries</option>
                <option value="Handmade Crafts">Handmade Crafts</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="reg-store-bio">Store Bio / Description *</label>
              <textarea id="reg-store-bio" name="storeBio" class="form-control" rows="2" placeholder="Tell neighborhood shoppers about your sustainable practices, ingredients, or craftsmanship..."></textarea>
            </div>
          </div>

          <div id="reg-error-alert" style="display: none; background: var(--danger-light); border: 1px solid var(--danger); color: var(--danger); font-size: 0.82rem; padding: 10px; border-radius: var(--radius-sm); margin-bottom: 16px;"></div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">
            Create Account & Join
          </button>
        </form>

        <div style="margin-top: 20px; text-align: center; font-size: 0.88rem; color: var(--text-muted); border-top: 1px solid var(--border-light); padding-top: 16px;">
          Already have an account? <a href="login.html" style="font-weight: 600;">Sign in here</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Global Shared Footer -->
  <div id="site-footer"></div>

  <!-- Core Scripts -->
  <script src="../js/storage.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/orders.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/register.js"></script>
</body>
</html>
