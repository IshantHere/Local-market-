<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - Local Market</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Global Shared Header -->
  <div id="site-header"></div>

  <main class="page-wrapper">
    <div class="container" style="max-width: 800px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
        <div>
          <h1 style="font-size: 1.45rem; font-weight: 700; color: var(--text-main);">
            Activity & Notifications
          </h1>
          <p style="font-size: 0.85rem; color: var(--text-muted);">
            Delivery milestones, vendor confirmations, and neighborhood vouchers.
          </p>
        </div>
        <div style="display: flex; gap: 10px;">
          <button class="btn btn-sm btn-outline" id="mark-all-read-btn">Mark All as Read</button>
          <button class="btn btn-sm btn-outline text-danger" id="clear-notifications-btn">Clear All</button>
        </div>
      </div>

      <div id="notifications-list-container">
        <!-- Rendered by notifications.js -->
      </div>
    </div>
  </main>

  <!-- Global Shared Footer -->
  <div id="site-footer"></div>

  <!-- Core Scripts -->
  <script src="../js/storage.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/orders.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/notifications.js"></script>
</body>
</html>
