<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Orders - Vendor Portal</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Global Shared Header -->
  <div id="site-header"></div>

  <main class="page-wrapper">
    <div class="container">
      <div style="margin-bottom: 24px; padding-bottom: 14px; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
        <div>
          <span class="badge badge-warning" style="margin-bottom: 4px;">Vendor Portal</span>
          <h1 style="font-size: 1.45rem; font-weight: 700; color: var(--text-main);">Store Orders & Fulfillment</h1>
          <p style="font-size: 0.85rem; color: var(--text-muted);">Confirm customer orders, pack items, and advance status along the local delivery pipeline.</p>
        </div>

        <div style="display: flex; gap: 8px;">
          <a href="vendor-dashboard.html" class="btn btn-sm btn-outline">&larr; Dashboard</a>
          <a href="vendor-products.html" class="btn btn-sm btn-outline">My Catalog</a>
        </div>
      </div>

      <!-- Filter Tabs by Status -->
      <div style="display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; white-space: nowrap; padding-bottom: 4px;" id="order-status-tabs">
        <button class="btn btn-sm btn-primary order-filter-tab active" data-filter="all">All Orders</button>
        <button class="btn btn-sm btn-outline order-filter-tab" data-filter="Placed">Placed (New)</button>
        <button class="btn btn-sm btn-outline order-filter-tab" data-filter="Confirmed">Confirmed</button>
        <button class="btn btn-sm btn-outline order-filter-tab" data-filter="Packed">Packed</button>
        <button class="btn btn-sm btn-outline order-filter-tab" data-filter="Shipped">Shipped</button>
        <button class="btn btn-sm btn-outline order-filter-tab" data-filter="Out for delivery">Out for Delivery</button>
        <button class="btn btn-sm btn-outline order-filter-tab" data-filter="Delivered">Delivered</button>
      </div>

      <!-- Orders List Container -->
      <div id="vendor-orders-list-container">
        <!-- Rendered by vendor-orders.js -->
      </div>
    </div>
  </main>

  <!-- Global Shared Footer -->
  <div id="site-footer"></div>

  <!-- Core Scripts -->
  <script src="../js/storage.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/orders.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/vendor-orders.js"></script>
</body>
</html>
