<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Dashboard - Local Market</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Global Shared Header -->
  <div id="site-header"></div>

  <main class="page-wrapper">
    <div class="container">
      <!-- Vendor Navigation Subheader -->
      <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-light);">
        <div>
          <span class="badge badge-warning" style="margin-bottom: 4px;">Vendor Portal</span>
          <h1 style="font-size: 1.45rem; font-weight: 700; color: var(--text-main);" id="vendor-store-title">
            Store Dashboard
          </h1>
          <p style="font-size: 0.85rem; color: var(--text-muted);" id="vendor-store-meta">
            Managing your local farm & artisan catalog
          </p>
        </div>

        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <a href="vendor-products.html" class="btn btn-sm btn-primary">+ Add Product</a>
          <a href="vendor-orders.html" class="btn btn-sm btn-outline">Orders Pipeline</a>
          <a href="vendor-promos.html" class="btn btn-sm btn-outline">Promotions</a>
          <a href="vendor-store.html" class="btn btn-sm btn-outline">⚙ Store Profile</a>
        </div>
      </div>

      <!-- Low Stock Warning Banner (Rendered dynamically if stock <= 5) -->
      <div id="vendor-low-stock-alert"></div>

      <!-- Stat Cards Grid -->
      <div class="stat-grid" id="vendor-stats-grid">
        <!-- Rendered by vendor-dashboard.js -->
      </div>

      <!-- Two Column Layout: Recent Orders & Catalog Overview -->
      <div style="display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 24px; align-items: flex-start;">
        <!-- Left: Recent Store Orders -->
        <div class="card" style="padding: 0; overflow: hidden;">
          <div style="padding: 16px 20px; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center;">
            <h3 style="font-size: 1rem; font-weight: 700;">Recent Store Orders</h3>
            <a href="vendor-orders.html" style="font-size: 0.82rem; font-weight: 600;">View all orders &rarr;</a>
          </div>
          <div id="vendor-recent-orders-list">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Right: Store Status & Fast Actions -->
        <div style="display: flex; flex-direction: column; gap: 18px;">
          <!-- Store Status Card -->
          <div class="card" id="vendor-store-status-card">
            <!-- Populated by JS -->
          </div>

          <!-- Active Promotions Card -->
          <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
              <h3 style="font-size: 0.95rem; font-weight: 700;">Active Store Promotions</h3>
              <a href="vendor-promos.html" style="font-size: 0.8rem; font-weight: 600;">Manage &rarr;</a>
            </div>
            <div id="vendor-promos-mini-list">
              <!-- Populated by JS -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Global Shared Footer -->
  <div id="site-footer"></div>

  <!-- Core Scripts -->
  <script src="../js/storage.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/orders.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/vendor-dashboard.js"></script>
</body>
</html>
